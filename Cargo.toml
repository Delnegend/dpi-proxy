[package]
name = "dpi-proxy"
version = "0.7.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "HTTP proxy for bypassing ISP Deep Packet Inspection (DPI) blocking"

[dependencies]
dotenv = { package = "dotenv-ng", version = "1.0.0" }
http = "1.5.0"
httparse = "1.10.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
redundant_pub_crate = "allow"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
lto = "thin"
strip = true
