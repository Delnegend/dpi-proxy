name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BINARY_NAME: dpi-proxy
  # Lowercase on purpose: buildx normalises the name on push, so `Delnegend`
  # is what the build logs show and `delnegend` is what anyone can pull.
  IMAGE: ghcr.io/delnegend/dpi-proxy
jobs:
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build-binary:
    name: Build Linux x86_64 binary
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install musl linker
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build executable
        shell: bash
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package executable
        uses: Delnegend/actions/package-artifact@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          name: dpi-proxy
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-unknown-linux-musl
          source: target/x86_64-unknown-linux-musl/release/dpi-proxy
          extra: scripts/steam.pac LICENSE-MIT LICENSE-APACHE


  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --target "$TARGET"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # Pin to v5 (last pre-OSMF release): v6+/v7 require accepting the
          # Open Source Maintenance Fee EULA before any command can run.
          dotnet tool install --global wix --version 5.0.2

      # WiX takes only numeric x.y.z versions, which a test-build version is
      # not. Resolve the installer version here so the WiX build and the
      # bundle below name the same file in every mode.
      - name: Resolve installer version
        id: installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.publish }}" -eq "true" ? "${{ needs.prepare.outputs.version }}" : "0.0.0"
          "version=$version" >> "$env:GITHUB_OUTPUT"

      - name: Build Windows Installer (WiX MSI)
        shell: pwsh
        env:
          WIX_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null
          wix build installer\dpi-proxy.wxs -arch x64 -d "Version=$env:WIX_VERSION" -o "installer\output\dpi-proxy-v$env:WIX_VERSION-windows-x64.msi"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-${{ matrix.arch }}-installer
          path: installer/output/*.msi
          if-no-files-found: error
  build-container:
    name: Build container image
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      # The shared build action writes its registry cache even for test builds.
      - name: Log in for test-build cache
        if: needs.prepare.outputs.publish != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: Delnegend/actions/docker-build-push@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          version: ${{ needs.prepare.outputs.version }}
          publish: ${{ needs.prepare.outputs.publish }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Consolidated Release
    needs: [prepare, build-binary, build-windows, build-container]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Consolidated Release
        uses: Delnegend/actions/publish-release@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          publish: ${{ needs.prepare.outputs.publish }}
          download: "true"
          image: ${{ env.IMAGE }}
          version: ${{ needs.prepare.outputs.version }}
